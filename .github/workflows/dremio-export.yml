name: Export Dremio Query

on:
  schedule:
    # 07:30 China Standard Time (UTC+8) = 23:30 UTC (previous day)
    - cron: "30 23 * * *"
    # 08:00 / 08:30 / 09:00 / 09:30 China Standard Time = 00:00 / 00:30 / 01:00 / 01:30 UTC
    - cron: "0 0,1 * * *"
    - cron: "30 0,1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Dremio export
        env:
          DREMIO_URL: ${{ secrets.DREMIO_URL }}
          DREMIO_SQL: ${{ secrets.DREMIO_SQL }}
          DREMIO_SQL_FILE: dremio_query.sql
          DREMIO_AUTH_HEADER: ${{ secrets.DREMIO_AUTH_HEADER }}
          DREMIO_AUTH_SCHEME: ${{ secrets.DREMIO_AUTH_SCHEME }}
          DREMIO_TOKEN: ${{ secrets.DREMIO_TOKEN }}
          DREMIO_JOB_TIMEOUT_SECONDS: "1800"
          OUTPUT_DIR: output
          OUTPUT_BASENAME: ops_v_raw_gts_events
        run: python scripts/export_dremio.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: dremio-export
          path: output/
          if-no-files-found: error

      - name: Email CSV attachment (final run only)
        env:
          OUTPUT_DIR: output
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_SUBJECT: ${{ secrets.SMTP_SUBJECT }}
          SMTP_BODY: ${{ secrets.SMTP_BODY }}
          SHOULD_EMAIL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *' }}
        run: |
          set -e
          if [ "$SHOULD_EMAIL" != "true" ]; then
            echo "Skipping email: this is not the final 09:30 CST run."
            exit 0
          fi

          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$SMTP_FROM" ] && [ -n "$SMTP_TO" ]; then
            python scripts/send_email_with_attachment.py
          else
            echo "Skipping email delivery: required SMTP secrets are not fully configured."
          fi
